services:

  postgres:
    image: postgres:18
    container_name: finance_tracker_postgres
    restart: always
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: finance_tracker_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance_tracker_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=finance_tracker;Username=postgres;Password=postgres"
      Redis__ConnectionString: "redis:6379"

      JwtSettings__Key: "YOUR_SUPER_SECRET_KEY_123456789"
      JwtSettings__Issuer: "FinanceTracker"
      JwtSettings__Audience: "FinanceTracker"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: